<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎭 Генератор аватарок по тексту | DiceBear AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(20, 22, 50, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 30px 25px 35px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 1px rgba(138, 180, 248, 0.15);
            transition: all 0.3s;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #FFF, #B5F0FF, #D9B4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #b2bbdf;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        /* Поле ввода */
        .input-group {
            margin-bottom: 22px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            color: #e2eaff;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        textarea {
            width: 100%;
            background: #0e0f1f;
            border: 1px solid #2e3660;
            border-radius: 28px;
            padding: 14px 20px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #8a9bf8;
            box-shadow: 0 0 0 3px rgba(138, 155, 248, 0.3);
        }

        /* Выбор стиля */
        .style-selector {
            margin-bottom: 28px;
        }
        .style-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }
        .style-btn {
            background: rgba(30, 34, 70, 0.7);
            border: 1px solid #3c4270;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #ccd6f0;
        }
        .style-btn.active {
            background: #6c63ff;
            border-color: #6c63ff;
            color: white;
            box-shadow: 0 4px 12px rgba(108,99,255,0.4);
        }
        .style-btn:hover {
            transform: translateY(-2px);
            background: #4a44c2;
            border-color: #8a9bf8;
        }

        /* Аватарка */
        .avatar-preview {
            display: flex;
            justify-content: center;
            margin: 20px 0 20px;
        }
        .avatar-circle {
            width: 220px;
            height: 220px;
            background: #0a0b18;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid rgba(108, 99, 255, 0.6);
            box-shadow: 0 20px 30px -10px black;
            transition: 0.2s;
        }
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #8a9bf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Кнопки действий */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0 20px;
        }
        .btn {
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(95deg, #6c63ff, #3f3a9e);
            color: white;
            box-shadow: 0 6px 14px rgba(108,99,255,0.3);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }
        .btn-secondary {
            background: rgba(138, 155, 248, 0.15);
            border: 1px solid #8a9bf8;
            color: #d0dbff;
        }
        .btn-secondary:hover {
            background: rgba(138, 155, 248, 0.3);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #4a4f82;
            color: #cdd6f4;
        }
        .btn-outline:hover {
            background: #2d3158;
        }

        /* инфо блок */
        .info-note {
            background: rgba(0,0,0,0.3);
            border-radius: 28px;
            padding: 14px;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 20px;
            color: #aeb9e2;
        }

        @media (max-width: 500px) {
            .glass-card { padding: 20px; }
            .avatar-circle { width: 170px; height: 170px; }
            .btn { padding: 8px 18px; font-size: 0.85rem; }
            h1 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

<div class="glass-card">
    <h1>✨ AI-аватарка по тексту</h1>
    <div class="sub">Опишите характер, стиль или образ — получите уникальную аватарку</div>

    <div class="input-group">
        <label>📝 Ваше описание (на любом языке)</label>
        <textarea id="promptInput" rows="3" placeholder="Пример: дерзкий космический пилот, милый кот с шарфом, тёмный эльф с фиолетовыми глазами..."></textarea>
    </div>

    <div class="style-selector">
        <label>🎨 Выберите стиль аватарки</label>
        <div class="style-buttons" id="styleContainer">
            <!-- стили подставятся через JS, но можно и вручную -->
        </div>
    </div>

    <div class="avatar-preview">
        <div class="avatar-circle" id="avatarCircle">
            <div class="loading-spinner" id="spinner" style="display: none;"></div>
            <img id="avatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle fill='%23333366' cx='50' cy='50' r='50'/%3E%3Ctext x='50' y='67' text-anchor='middle' fill='white' font-size='40' font-family='Arial'%3E🎭%3C/text%3E%3C/svg%3E" alt="avatar">
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-primary" id="generateBtn">🎨 Создать аватарку</button>
        <button class="btn btn-secondary" id="downloadBtn">💾 Скачать PNG</button>
        <button class="btn btn-outline" id="randomStyleBtn">🎲 Случайный стиль</button>
    </div>

    <div class="info-note">
        🔮 DiceBear AI генерирует векторную аватарку на основе вашего текста и выбранного стиля.<br>
        Миллионы комбинаций — каждая картинка уникальна. Нажмите «Создать» и получите результат за долю секунды.
    </div>
</div>

<script>
    // ---------- Доступные стили DiceBear (9.x) ----------
    const AVATAR_STYLES = [
        "adventurer", "adventurer-neutral", "avataaars", "big-ears", "big-smile",
        "bottts", "croodles", "dylan", "fun-emoji", "icons", "identicon",
        "lorelei", "micah", "miniavs", "open-peeps", "personas", "pixel-art"
    ];

    // Состояние
    let currentStyle = "pixel-art";    // стиль по умолчанию
    let currentSeed = "default";
    let currentImageBlob = null;

    // DOM элементы
    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const randomStyleBtn = document.getElementById('randomStyleBtn');
    const avatarImg = document.getElementById('avatarImg');
    const spinner = document.getElementById('spinner');
    const styleContainer = document.getElementById('styleContainer');

    // Функция: текст -> seed (стабильное уникальное значение)
    function textToSeed(text) {
        if (!text.trim()) text = "dream avatar";
        let hash = 0;
        for (let i = 0; i < text.length; i++) {
            hash = ((hash << 5) - hash) + text.charCodeAt(i);
            hash |= 0;
        }
        // делаем положительное число в виде строки
        let positiveHash = Math.abs(hash).toString(36);
        // Добавим небольшой рандомный соль, но чтобы текст давал всегда одинаковый seed – оставим как есть
        return positiveHash;
    }

    // Генерация URL аватарки по стилю и seed (с дополнительными параметрами для красоты)
    function buildAvatarUrl(style, seed) {
        // Добавим приятный фон (светлые тона) и radius=50 (круглая аватарка)
        // Можно также добавить случайные аксессуары, но оставим чисто seed
        let baseUrl = `https://api.dicebear.com/9.x/${style}/svg?seed=${seed}&backgroundColor=b6e3f4,ffd5dc,c0aede,ffc3a0&radius=50`;
        // некоторые стили лучше работают с опцией "flip" или "eyes", но необязательно
        return baseUrl;
    }

    // Обновить аватарку (показать загрузку и загрузить новую картинку)
    async function updateAvatar(style, seed) {
        // Показываем спиннер, прячем картинку
        spinner.style.display = 'block';
        avatarImg.style.display = 'none';
        downloadBtn.disabled = true;

        const url = buildAvatarUrl(style, seed);

        // Предзагружаем изображение, чтобы получить blob для скачивания
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Ошибка загрузки');
            const blob = await response.blob();
            currentImageBlob = blob;
            const objectUrl = URL.createObjectURL(blob);
            avatarImg.onload = () => {
                URL.revokeObjectURL(objectUrl);
                spinner.style.display = 'none';
                avatarImg.style.display = 'block';
                downloadBtn.disabled = false;
            };
            avatarImg.onerror = () => {
                spinner.style.display = 'none';
                avatarImg.style.display = 'block';
                avatarImg.src = url; // fallback
                downloadBtn.disabled = false;
            };
            avatarImg.src = objectUrl;
        } catch (err) {
            console.warn(err);
            // fallback: прямая ссылка, но может не дать blob для скачивания
            avatarImg.src = url;
            spinner.style.display = 'none';
            avatarImg.style.display = 'block';
            downloadBtn.disabled = false;
            // попробуем получить blob повторно через img
            fetch(url).then(r=>r.blob()).then(b=>currentImageBlob=b).catch(e=>console.log);
        }
    }

    // Генерация по текущему тексту и стилю
    function generateFromPrompt() {
        let promptText = promptInput.value.trim();
        if (!promptText) {
            promptText = "волшебный дракон, абстракция, красивая аватарка";
            promptInput.value = promptText;
        }
        const seed = textToSeed(promptText);
        currentSeed = seed;
        updateAvatar(currentStyle, currentSeed);
    }

    // Скачать PNG (через canvas для конвертации SVG -> PNG)
    async function downloadPNG() {
        if (!avatarImg.src || avatarImg.src === "" || avatarImg.style.display === 'none') {
            alert("Сначала сгенерируйте аватарку");
            return;
        }

        // Если у нас есть blob текущего изображения, используем его, иначе конвертируем через canvas
        let imageBlob = currentImageBlob;
        if (!imageBlob) {
            try {
                const resp = await fetch(avatarImg.src);
                imageBlob = await resp.blob();
            } catch(e) {
                alert("Не удалось сохранить, попробуйте правой кнопкой мыши");
                return;
            }
        }

        // Если это SVG, лучше сконвертировать в PNG через canvas
        if (imageBlob.type === 'image/svg+xml' || avatarImg.src.includes('.svg')) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            const url = URL.createObjectURL(imageBlob);
            img.crossOrigin = "Anonymous";
            const loadPromise = new Promise((resolve, reject) => {
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    canvas.toBlob(blob => {
                        resolve(blob);
                    }, 'image/png');
                };
                img.onerror = reject;
            });
            img.src = url;
            const pngBlob = await loadPromise;
            const downloadUrl = URL.createObjectURL(pngBlob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `avatar_${currentStyle}_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
        } else {
            // если уже png/jpg
            const downloadUrl = URL.createObjectURL(imageBlob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `avatar_${currentStyle}_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
        }
    }

    // Установить активный стиль в UI
    function setActiveStyle(styleName) {
        currentStyle = styleName;
        // обновить активную кнопку
        document.querySelectorAll('.style-btn').forEach(btn => {
            if (btn.getAttribute('data-style') === styleName) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        // перегенерировать с тем же seed, но новым стилем
        if (currentSeed && currentSeed !== "default") {
            updateAvatar(currentStyle, currentSeed);
        } else if (promptInput.value.trim()) {
            generateFromPrompt();
        } else {
            // если нет текста, создадим seed из текста по умолчанию
            let fallbackText = promptInput.value.trim();
            if (!fallbackText) fallbackText = "креативная аватарка";
            const seed = textToSeed(fallbackText);
            currentSeed = seed;
            updateAvatar(currentStyle, currentSeed);
        }
    }

    // Создать кнопки стилей
    function buildStyleButtons() {
        styleContainer.innerHTML = '';
        AVATAR_STYLES.forEach(style => {
            const btn = document.createElement('div');
            btn.className = 'style-btn';
            if (style === currentStyle) btn.classList.add('active');
            btn.textContent = style.replace('-', ' ').replace(/(?:^|\s)\S/g, a => a.toUpperCase());
            btn.setAttribute('data-style', style);
            btn.addEventListener('click', () => {
                setActiveStyle(style);
            });
            styleContainer.appendChild(btn);
        });
    }

    // Случайный стиль
    function randomStyle() {
        const randomIndex = Math.floor(Math.random() * AVATAR_STYLES.length);
        const newStyle = AVATAR_STYLES[randomIndex];
        setActiveStyle(newStyle);
    }

    // Инициализация
    function init() {
        buildStyleButtons();
        // Установим первый активный стиль по умолчанию (pixel-art)
        setActiveStyle('pixel-art');
        // Генерация примера при загрузке (по умолчанию)
        promptInput.value = "киберпанк-фокусник с неоновым шарфом";
        generateFromPrompt();

        generateBtn.addEventListener('click', generateFromPrompt);
        downloadBtn.addEventListener('click', downloadPNG);
        randomStyleBtn.addEventListener('click', randomStyle);
    }

    init();
</script>
</body>
</html>
